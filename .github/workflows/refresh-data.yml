name: Refresh NSE data

on:
  schedule:
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-nse-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fetch
      - run: npm run data
      - run: npm run build
      - name: Commit and push when the data moved
        run: |
          set -euo pipefail
          git config user.name "vmfs refresh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/score_raw_data.json src/data/scores.json
          if git diff --cached --quiet; then
            echo "No new NSE data — nothing to commit."
            exit 0
          fi
          as_of=$(node -e "console.log(require('./src/data/scores.json').asOf)")
          git commit -m "data: NSE refresh through ${as_of}"
          git push
