name: Refresh NSE data

# Pulls the latest NSE P/E, P/B, dividend yield and close for the six indices,
# rebuilds the scores and pushes the result. Vercel deploys on the push.
#
# 14:30 UTC = 20:00 IST, comfortably after the 15:30 IST close and NSE's
# end-of-day file update. Weekdays only; a holiday simply produces no diff.

on:
  schedule:
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh-nse-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch latest NSE data
        run: npm run fetch

      - name: Rebuild scores
        run: npm run data

      - name: Verify the bundle still builds
        run: npm run build

      - name: Commit and push when the data moved
        run: |
          set -euo pipefail
          git config user.name "vmfs refresh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/score_raw_data.json src/data/scores.json
          if git diff --cached --quiet; then
            echo "No new NSE data — nothing to commit."
            exit 0
          fi
          as_of=$(node -e "console.log(require('./src/data/scores.json').asOf)")
          git commit -m "data: NSE refresh through ${as_of}"
          git push
